[pytest]
markers =
    integration: marks tests as integration tests (require external resources like MDB files or test database)

; Python 3.13 Windows (ProactorEventLoop) 下，默认 function 级 loop scope 会导致
; 模块级 SQLAlchemy async engine 连接池跨事件循环复用报
; "RuntimeError: Event loop is closed" / "attached to a different loop"。
; 统一 session 级 loop scope 修复（2026-09-01）。
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

; v2.22.1：asyncio_mode=auto 启用后 async def test_* 免装饰器。
; 事务：删除 629 处 @pytest.mark.asyncio 函数级装饰器，AST 复核所有 async 测试
; 均在收集集内（无漏跑；此前"45 例漏跑"为统计脚本误报，git HEAD 复核为 0）。
asyncio_mode = auto

; ── 覆盖率基线（v2.15.1 建立；2026-09-28 实测 98.40%，注释自 41% 更新）─────────────────
; 低于基线将失败（CI 与本地一致）。提升覆盖率的测试补充在 tests/test_api.py +
; tests/integration/ 下。
addopts = --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=25 -p no:warnings