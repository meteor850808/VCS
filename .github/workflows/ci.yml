name: CI — 构建 测试 安全扫描

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vcs
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: vcs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov bandit

      - name: Security scan (Bandit)
        run: bandit -r app/ -ll -x tests/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://vcs:testpass@localhost:5432/vcs_test
          DATABASE_URL_SYNC: postgresql://vcs:testpass@localhost:5432/vcs_test
          REDIS_URL: redis://localhost:6379/0
          # 注意变量名：ADMIN_INIT_KEY（引导密钥），不是 API_KEY_INIT
          ADMIN_INIT_KEY: ci-test-init-key-7f3a9c1e2b5d8a4f6c0e9d1b2a4c6e8f
          DEBUG: "true"
        run: |
          pytest tests/ -v --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── 全链路冒烟（Docker Compose 起真实后端）──────────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Start VCS stack (api + postgres + redis + worker)
        run: |
          cp .env.example .env
          # 注入强引导密钥与安全默认
          sed -i 's/^ADMIN_INIT_KEY=.*/ADMIN_INIT_KEY=ci-smoke-9f3a7c1e2b5d8a4f6c0e9d1b2a4c6e8f/' .env
          echo "12345678" | docker compose up -d --build --wait api worker
          docker compose ps

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:45679/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker compose logs api; exit 1

      - name: Run smoke script
        env:
          VCS_SMOKE_BASE: http://localhost:45679
          VCS_SMOKE_ADMIN_KEY: ci-smoke-9f3a7c1e2b5d8a4f6c0e9d1b2a4c6e8f
        run: python scripts/smoke_convert.py --timeout 120 --export-results smoke-results.json

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results.json

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── 生产编排静态校验（compose 语法/引用 + 脚本 sh 语法）──────────────────────
  prod-config:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Validate prod compose
        run: |
          cp .env.example .env
          sh docker/scripts/gen_secrets.sh || true
          echo "admin:pass" > secrets/flower_basic_auth.txt
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Shell syntax check
        run: |
          bash -n docker/entrypoint.sh
          bash -n docker/scripts/gen_secrets.sh
          bash -n docker/scripts/gen_certs.sh
          bash -n docker/scripts/build_push.sh
          bash -n docker/registry/gen_htpasswd.sh
