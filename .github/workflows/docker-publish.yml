name: Docker — 构建并推送镜像（amd64 + arm64）

# 触发方式：
#  1) 手动：Actions 页 → 本 workflow → Run workflow（可填 tag）
#  2) 打 tag：git tag v2.24.0 && git push origin v2.24.0
# 必需 Secrets（Settings → Secrets and variables → Actions）：
#  DOCKERHUB_USERNAME  镜像仓库用户名/命名空间（如 meteor850808）
#  DOCKERHUB_TOKEN     登录凭据（PAT / Robot Token）
# 可选 Variables：
#  DOCKERHUB_REGISTRY  镜像仓库地址，默认 docker.io；换成内网 Harbor 即可切换仓库
#
# 构建策略：按 [平台 × 镜像] 拆成 10 个并行 job（各自推送 tag-amd64 / tag-arm64），
# 再由 merge-manifest 合并为一个 multi-arch manifest，避免单 job 里 arm64 走 QEMU 串行编译过慢。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像 tag（留空则自动取 git tag 或 latest）
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
        image:
          - { name: vcs-api,    dockerfile: Dockerfile,              target: api }
          - { name: vcs-worker, dockerfile: Dockerfile,              target: worker }
          - { name: vcs-beat,   dockerfile: Dockerfile,              target: beat }
          - { name: vcs-flower, dockerfile: Dockerfile,              target: flower }
          - { name: vcs-nginx,  dockerfile: docker/nginx/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve registry / namespace / tag / arch
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REGISTRY="${{ vars.DOCKERHUB_REGISTRY || 'docker.io' }}"
          NS="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="latest"
          fi
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH##*/}"
          {
            echo "registry=$REGISTRY"
            echo "namespace=$NS"
            echo "tag=$TAG"
            echo "arch=$ARCH"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $REGISTRY/$NS/${{ matrix.image.name }}:$TAG-$ARCH"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (single arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.namespace }}/${{ matrix.image.name }}:${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.arch }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.arch }}
          provenance: false

  # 合并 amd64 + arm64 为 multi-arch manifest，并清理中间 tag
  merge-manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Resolve registry / namespace / tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REGISTRY="${{ vars.DOCKERHUB_REGISTRY || 'docker.io' }}"
          NS="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="latest"
          fi
          {
            echo "registry=$REGISTRY"
            echo "namespace=$NS"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge multi-arch manifests
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          NS: ${{ steps.meta.outputs.namespace }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for IMG in vcs-api vcs-worker vcs-beat vcs-flower vcs-nginx; do
            SRC="$REGISTRY/$NS/$IMG"
            echo "==> merge $SRC:$TAG  <- $TAG-amd64 + $TAG-arm64"
            docker buildx imagetools create \
              -t "$SRC:$TAG" \
              "$SRC:$TAG-amd64" "$SRC:$TAG-arm64"
            echo "==> verify $SRC:$TAG"
            docker buildx imagetools inspect "$SRC:$TAG"
          done
