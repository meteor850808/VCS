# ── 公共配置 ──────────────────────────────────────────────────────────────────
x-app-common: &app-common
  build:
    context: .
    target: base
  env_file: .env
  # 容器内连接串由 docker/entrypoint.sh 从 POSTGRES_* 派生（单一真源）
  environment: &app-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-vcs_db}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    UPLOAD_DIR: /data/uploads
    OUTPUT_DIR: /data/outputs
    QUALITY_REPORT_DIR: /data/quality_reports
    LOG_FILE: /data/logs/vcs.log
  volumes:
    - vector_uploads:/data/uploads
    - vector_outputs:/data/outputs
    - vector_reports:/data/quality_reports
    - vector_logs:/data/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - vcs_net

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4-alpine     # PostGIS 扩展（可选）
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-vcs_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}   # 与默认连接串密码保持一致
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vcs_net
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vcs_net
    restart: unless-stopped

  # ── 数据库迁移（一次性 Job）─────────────────────────────────────────────────
  migrate:
    <<: *app-common
    command: ["sh", "-c", "alembic upgrade head && python scripts/init_db.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── FastAPI 主服务 ────────────────────────────────────────────────────────────
  api:
    <<: *app-common
    build:
      context: .
      target: api
    ports:
      - "45679:8000"                       # 对外统一 45679（与 restart.bat 一致）
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  worker:
    <<: *app-common
    build:
      context: .
      target: worker
    deploy:
      replicas: 2                    # 可水平扩展
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ── Flower（Celery 监控 UI）───────────────────────────────────────────────────
  flower:
    <<: *app-common
    build:
      context: .
      target: flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:changeme}

  # ── Celery Beat（定时任务调度器）──────────────────────────────────────────────
  beat:
    <<: *app-common
    build:
      context: .
      target: beat
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

# ── 数据卷 ────────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  redis_data:
  vector_uploads:
  vector_outputs:
  vector_reports:
  vector_logs:

# ── 网络 ──────────────────────────────────────────────────────────────────────
networks:
  vcs_net:
    driver: bridge
